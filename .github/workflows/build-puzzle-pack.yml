name: Build puzzle pack
on:
  workflow_dispatch:
    inputs:
      tactical:
        description: Tactical position count
        default: "50000"
      quiet:
        description: Quiet position count
        default: "50000"
  schedule:
    - cron: "23 4 1 * *"
permissions:
  contents: write
concurrency:
  group: puzzle-pack
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-generator.txt
      - name: Install generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          python -m pip install --upgrade pip
          pip install -r requirements-generator.txt
      - name: Generate 100,000-position pack
        run: >
          python scripts/build_dataset.py
          --tactical ${{ inputs.tactical || '50000' }}
          --quiet ${{ inputs.quiet || '50000' }}
          --stockfish /usr/games/stockfish
      - name: Commit updated pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update 100k Lichess puzzle pack"
          git pull --rebase origin main
          git push
